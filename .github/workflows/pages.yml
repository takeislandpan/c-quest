# main に push すると GitHub Pages に公開する。
# Cコンパイラ(@yowasp/clang)は大きいのでリポジトリには入れず、ここで npm から取ってきて一緒に置く。
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Assemble site
        run: |
          mkdir -p _site/node_modules/@yowasp/clang
          cp -r index.html src assets _site/
          cp -r node_modules/@yowasp/clang/gen _site/node_modules/@yowasp/clang/
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
